[project]
name = "ai-employee-bronze"
version = "0.1.0"
description = "Bronze Tier MVP - Personal AI Employee for autonomous email triage and file processing"
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "watchdog>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
