[project]
name = "ai-employee-gold"
version = "0.3.0"
description = "Gold Tier - Autonomous AI Employee with trust framework, calendar management, document generation, analytics, and CRM"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "watchdog>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "mcp>=0.1.0",
    "apscheduler>=3.10.0",
    "requests>=2.31.0",
    "jsonschema>=4.20.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "cryptography>=41.0.0",
    "keyring>=24.3.0",
    "openai>=1.10.0",
    "pydub>=0.25.0",
    "audioop-lts>=0.2.0",
    "zoomus>=1.1.10",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.25.0",
    "Pillow>=10.2.0",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
ocr = [
    "easyocr>=1.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
