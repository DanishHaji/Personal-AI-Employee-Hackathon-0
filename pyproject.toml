[project]
name = "ai-employee-silver"
version = "0.2.0"
description = "Silver Tier - Personal AI Employee with autonomous task execution and multi-channel communication"
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "watchdog>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "mcp>=0.1.0",
    "apscheduler>=3.10.0",
    "requests>=2.31.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
